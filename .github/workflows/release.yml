name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'CalVer version (e.g., 2026.9.0). Leave empty to auto-calculate from the current month'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if [ -z "$VERSION" ]; then
            # CalVer: YYYY.M.PATCH, PATCH increments within the month
            BASE="$(date -u +%Y).$(date -u +%-m)"
            LAST=$(git tag -l "v${BASE}.*" | sed "s/^v${BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
            VERSION="${BASE}.$(( ${LAST:--1} + 1 ))"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]{4}\.([1-9]|1[0-2])\.[0-9]+$'; then
            echo "::error::Invalid version '$VERSION', expected YYYY.M.PATCH (e.g., 2026.9.0)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} already exists"
            exit 1
          fi
          echo "Releasing v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Set package.json version
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Lint
        run: bun lint

      - name: Build
        run: bun run build

      - name: Verify build output
        run: |
          if [ ! -f dynamic-weather-card.js ]; then
            echo "Build failed: dynamic-weather-card.js not found"
            exit 1
          fi
          echo "Build successful: $(wc -l < dynamic-weather-card.js) lines"

      - name: Generate Changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CURRENT_TAG="${{ steps.version.outputs.tag }}"

          echo "Generating changelog from ${PREV_TAG} to ${CURRENT_TAG}"

          # Generate changelog from commits
          if [ -z "$PREV_TAG" ]; then
            # First release - get all commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # Get commits since last tag
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Categorize commits
          SCOPE='(\([^)]*\))?!?:'
          FEATURES=$(echo "$COMMITS" | grep -E "^- (feat|feature)${SCOPE}" || echo "")
          FIXES=$(echo "$COMMITS" | grep -E "^- (fix|bugfix)${SCOPE}" || echo "")
          DOCS=$(echo "$COMMITS" | grep -E "^- docs?${SCOPE}" || echo "")
          CHORES=$(echo "$COMMITS" | grep -E "^- (chore|build|ci)${SCOPE}" || echo "")
          OTHERS=$(echo "$COMMITS" | grep -vE "^- (feat|feature|fix|bugfix|docs?|chore|build|ci)${SCOPE}" || echo "")

          # Build changelog
          CHANGELOG="## What's Changed"$'\n'$'\n'

          if [ -n "$FEATURES" ]; then
            CHANGELOG+="### ✨ Features"$'\n'
            CHANGELOG+="$FEATURES"$'\n'$'\n'
          fi

          if [ -n "$FIXES" ]; then
            CHANGELOG+="### 🐛 Bug Fixes"$'\n'
            CHANGELOG+="$FIXES"$'\n'$'\n'
          fi

          if [ -n "$DOCS" ]; then
            CHANGELOG+="### 📚 Documentation"$'\n'
            CHANGELOG+="$DOCS"$'\n'$'\n'
          fi

          if [ -n "$CHORES" ]; then
            CHANGELOG+="### 🔧 Chores & Maintenance"$'\n'
            CHANGELOG+="$CHORES"$'\n'$'\n'
          fi

          if [ -n "$OTHERS" ]; then
            CHANGELOG+="### Other Changes"$'\n'
            CHANGELOG+="$OTHERS"$'\n'$'\n'
          fi

          # Add compare link if there's a previous tag
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG+="**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}"
          fi

          # Save to file for release notes
          echo "$CHANGELOG" > /tmp/changelog.md

          # Output for GitHub Actions (escape newlines)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG.md
        run: |
          CURRENT_TAG="${{ steps.version.outputs.tag }}"
          RELEASE_DATE=$(date +%Y-%m-%d)

          # Create or update CHANGELOG.md
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "All notable changes to this project will be documented in this file." >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi

          # Add new release section at the top (after the header)
          {
            head -n 3 CHANGELOG.md
            echo ""
            echo "## [${CURRENT_TAG}] - ${RELEASE_DATE}"
            echo ""
            cat /tmp/changelog.md
            echo ""
            tail -n +4 CHANGELOG.md
          } > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit release
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json dynamic-weather-card.js
          git commit -m "chore(release): ${{ steps.version.outputs.tag }}" || echo "No changes to commit"
          if git push origin HEAD:main; then
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            echo "::warning::Could not push release commit to main, tagging ${GITHUB_SHA} instead"
            echo "sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Release ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: dynamic-weather-card.js
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
